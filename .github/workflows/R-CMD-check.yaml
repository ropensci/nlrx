# R-CMD-check for nlrx.
#
# The matrix mirrors the platforms CRAN checks on (Linux, macOS, Windows; see
# https://cran.r-project.org/web/checks/check_flavors.html) and includes r-devel
# and oldrel, because CRAN checks those too.
#
# Simulations need a local NetLogo installation, so every job installs NetLogo
# and exports NETLOGO_HOME. The tests skip the execution path when that variable
# is missing, which keeps them usable without a NetLogo installation.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

# A new push to a pull request supersedes the run that is still going. The
# macOS jobs are long, so letting them finish costs a lot of runner time for a
# result nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  NETLOGO_VERSION: "7.0.4"

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release', slow_tests: 'true'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: macos-latest,   r: 'release', netlogo_arch: 'aarch64'}
          - {os: macos-26-intel, r: 'release', netlogo_arch: 'x86_64'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Empty on every entry but one, which skips the calibrated ABC sampler
      # there. The uncalibrated one still runs everywhere, so no platform loses
      # coverage of the ABC execution path. See tests/testthat/helper-netlogo.R.
      NLRX_SLOW_TESTS: ${{ matrix.config.slow_tests }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NetLogo (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o netlogo.tgz "https://github.com/NetLogo/NetLogo/releases/download/v${NETLOGO_VERSION}/NetLogo-${NETLOGO_VERSION}-64.tgz"
          mkdir -p "${HOME}/netlogo"
          tar -xzf netlogo.tgz --directory "${HOME}/netlogo"
          rm netlogo.tgz
          echo "NETLOGO_HOME=${HOME}/netlogo/NetLogo ${NETLOGO_VERSION}" >> "${GITHUB_ENV}"

      - name: Install NetLogo (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o netlogo.dmg "https://github.com/NetLogo/NetLogo/releases/download/v${NETLOGO_VERSION}/NetLogo-${NETLOGO_VERSION}-${{ matrix.config.netlogo_arch }}.dmg"
          hdiutil attach netlogo.dmg -mountpoint /Volumes/netlogo -nobrowse -quiet
          mkdir -p "${HOME}/netlogo"
          # The disk image holds a single folder named like the version, with the
          # models at its root (same layout as the Linux archive).
          cp -R "/Volumes/netlogo/NetLogo ${NETLOGO_VERSION}" "${HOME}/netlogo/"
          # The quarantine attribute travels with the copy out of the disk image,
          # and nothing here wants Gatekeeper reassessing a bundle it already
          # mounted. This was also tried as an explanation for macOS being far
          # slower than Linux, which it is not: the runtime is NetLogo start-up
          # in the slow execution tests, and stripping the attribute changed
          # nothing measurable.
          xattr -dr com.apple.quarantine "${HOME}/netlogo/NetLogo ${NETLOGO_VERSION}" || true
          hdiutil detach /Volumes/netlogo -quiet
          rm netlogo.dmg
          echo "NETLOGO_HOME=${HOME}/netlogo/NetLogo ${NETLOGO_VERSION}" >> "${GITHUB_ENV}"

      - name: Install NetLogo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/NetLogo/NetLogo/releases/download/v$env:NETLOGO_VERSION/NetLogo-$env:NETLOGO_VERSION-64.msi"
          curl.exe -fsSL -o netlogo.msi $url
          Start-Process msiexec.exe -ArgumentList "/i", "netlogo.msi", "/qn", "/norestart" -Wait
          Remove-Item netlogo.msi
          $candidates = @(
            "C:/Program Files/NetLogo $env:NETLOGO_VERSION",
            "C:/Program Files (x86)/NetLogo $env:NETLOGO_VERSION"
          )
          $home_dir = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $home_dir) {
            Write-Host "NetLogo not found in the expected locations. Contents of C:/Program Files:"
            Get-ChildItem "C:/Program Files" | Select-Object -ExpandProperty Name
            exit 1
          }
          "NETLOGO_HOME=$home_dir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify the NetLogo installation
        shell: bash
        run: |
          echo "NETLOGO_HOME=${NETLOGO_HOME}"
          test -d "${NETLOGO_HOME}" || { echo "NETLOGO_HOME is not a directory"; exit 1; }
          # What the tests and logolink need: the sample models and the console.
          test -f "${NETLOGO_HOME}/models/Sample Models/Biology/Wolf Sheep Predation.nlogox" \
            || { echo "Sample models missing; contents:"; ls "${NETLOGO_HOME}"; exit 1; }
          test -e "${NETLOGO_HOME}/NetLogo_Console" \
            || { echo "NetLogo_Console missing; contents:"; ls "${NETLOGO_HOME}"; exit 1; }

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-snapshots: true

  # A single job that runs the CRAN-specific incoming checks, including the URL
  # checks, which the matrix above skips. This is what catches problems that
  # would otherwise only surface after submitting to CRAN.
  cran-incoming:
    runs-on: ubuntu-latest
    name: CRAN incoming checks

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_CRAN_INCOMING_: true
      _R_CHECK_CRAN_INCOMING_REMOTE_: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # No NetLogo here: the execution tests skip without NETLOGO_HOME, which is
      # exactly the situation on the CRAN check machines.
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'
          upload-snapshots: true

  test-coverage:
    runs-on: ubuntu-latest
    name: Test coverage

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Coverage needs the calibrated sampler too, or the arguments only it
      # passes to EasyABC would be reported as uncovered.
      NLRX_SLOW_TESTS: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NetLogo
        run: |
          curl -fsSL -o netlogo.tgz "https://github.com/NetLogo/NetLogo/releases/download/v${NETLOGO_VERSION}/NetLogo-${NETLOGO_VERSION}-64.tgz"
          mkdir -p "${HOME}/netlogo"
          tar -xzf netlogo.tgz --directory "${HOME}/netlogo"
          rm netlogo.tgz
          echo "NETLOGO_HOME=${HOME}/netlogo/NetLogo ${NETLOGO_VERSION}" >> "${GITHUB_ENV}"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      # covr::codecov() posts to Codecov's legacy /upload/v2 endpoint and returns
      # the response instead of raising, so a rejected upload left this job green.
      # Uploads had in fact been failing since 2025-11-25 without anyone noticing.
      # The official action reports a failed upload as a failed step, and it also
      # prefixes the branch name on pull requests from forks, which is what lets
      # those upload without access to the repository secret.
      - name: Compute coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v7
        with:
          files: ./cobertura.xml
          disable_search: true
          plugins: noop
          # A fork's pull request has no access to the secret and relies on the
          # tokenless path, which is rate limited, so a miss there must not fail
          # the job. On pushes a rejected upload is a real problem and should.
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
          # CODECOV_TOKEN is an organisation-wide secret of ropensci, not a
          # per-repository token, and an organisation token cannot identify the
          # repository on its own. The action documents slug as required in that
          # case; it was missing, which is what the legacy uploader's 404
          # "Could not find a repository associated with upload token" describes.
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}

      # Coverage runs the full suite, NetLogo included. Without this the log ends
      # at the failure summary and says nothing about which test broke.
      - name: Show testthat output
        if: always()
        run: find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash
